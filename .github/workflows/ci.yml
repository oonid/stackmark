# Every gate that Stage 0 ran by hand.
#
# The JavaScript toolchain is Docker-only by design, so these jobs call the
# same ./dev wrapper a developer calls; nothing here installs Node or pnpm on
# the runner. Rust is host-native by the same design, so it builds directly.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Wrapper contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Asserts the compose services, pinned versions and ignore rules that
      # every other job depends on. Pure shell, so it fails in seconds rather
      # than after an image build.
      - run: bash tests/tooling/dev-wrapper.test.sh

  checks:
    name: Lint and unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./dev install
      - run: ./dev lint
      - run: ./dev unit

  e2e:
    name: Browser end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./dev install
      - run: ./dev e2e
      - name: Upload the report when the run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The same stack the release builder image installs, so a compile failure
      # here means the same thing it would mean in the package.
      - name: Install the Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config
      # rust-toolchain.toml pins the version; its minimal profile omits rustfmt.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      # cargo test regenerates the bindings. If the committed file no longer
      # matches the Rust definitions, a command drifted without the TypeScript
      # side being updated, and that is a build failure rather than something
      # for a user to discover.
      - name: Fail if the generated bindings are stale
        run: git diff --exit-code packages/platform/src/tauri/bindings.ts
