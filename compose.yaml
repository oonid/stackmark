services:
  js:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /tmp/stackmark-home
      PNPM_HOME: /tmp/stackmark-pnpm
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
      - node-modules:/workspace/node_modules
  frontend:
    extends:
      service: js
    command: pnpm --filter @stackmark/web dev --host 0.0.0.0
    ports:
      - "127.0.0.1:1420:1420"
  browser:
    build:
      context: .
      dockerfile: docker/browser-test.Dockerfile
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /tmp/stackmark-browser-home
      PNPM_HOME: /tmp/stackmark-browser-pnpm
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
      - node-modules:/workspace/node_modules
  tauri-builder:
    build:
      context: .
      dockerfile: docker/tauri-builder.Dockerfile
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    working_dir: /workspace/apps/desktop
    environment:
      HOME: /tmp/stackmark-builder-home
      PNPM_HOME: /tmp/stackmark-builder-pnpm
      CARGO_HOME: /cargo
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
      - node-modules:/workspace/node_modules
      - cargo-registry:/cargo/registry
      - cargo-git:/cargo/git

volumes:
  pnpm-store:
  node-modules:
  cargo-registry:
  cargo-git:
